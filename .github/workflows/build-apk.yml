name: Build SmsForwarder APK
on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6"
      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi
          mkdir -p source
          unzip -oq "$ZIP_FILE" -d source
          GRADLEW=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
      - name: Upgrade Gradle wrapper
        shell: bash
        run: |
          set -e
          FILE="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: Gradle wrapper properties not found."
            exit 1
          fi
          sed -i -E 's#gradle-[^/]+-(bin|all)\.zip#gradle-7.6-bin.zip#' "$FILE"
          sed -i '/^distributionSha256Sum=/d' "$FILE"
      - name: Add Maven Central repository
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("build.gradle", "app/build.gradle"):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              matches = list(re.finditer(r'\brepositories\s*\{', s))
              offset = 0
              for match in matches:
                  pos = match.end() - 1 + offset
                  depth = 0
                  end = None
                  for i in range(pos, len(s)):
                      if s[i] == "{":
                          depth += 1
                      elif s[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i
                              break
                  if end is None:
                      continue
                  block = s[pos:end + 1]
                  if not re.search(r'\bmavenCentral\s*\(', block):
                      addition = "\n        mavenCentral()\n"
                      s = s[:pos + 1] + addition + s[pos + 1:]
                      offset += len(addition)
              p.write_text(s)
              print("Checked repositories in", name)
          PY
      - name: Generate temporary debug keystore
        shell: bash
        run: |
          set -e
          KEYSTORE="$PROJECT_DIR/app/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Debug keystore is ready."
      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi
          cp "$APK" output/SmsForwarder-V56.2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-V56.2-APK
          path: output/SmsForwarder-V56.2.apk
          if-no-files-found: error
