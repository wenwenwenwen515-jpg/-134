name: Build SmsForwarder APK

on:
  workflow_dispatch:
  push:
   paths:
   - ‘**.zip’
   - ‘.github/workflows/build-apk.yml’

jobs:
 build:
  runs-on: ubuntu-22.04
  steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '11'
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '7.5.1'
  - name: Extract source ZIP
    shell: bash
    run: |
      set -e
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found in repository root."
        exit 1
      fi
      mkdir source
      unzip -q "$ZIP_FILE" -d source
      GRADLEW=$(find source -type f -name gradlew | head -n 1)
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: gradlew not found inside ZIP."
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLEW")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project directory: $PROJECT_DIR"
  - name: Show Gradle repository configuration
    shell: bash
    run: |
      set -e
      cd "$PROJECT_DIR"
      echo "===== build.gradle ====="
      if [ -f build.gradle ]; then
        sed -n '1,180p' build.gradle
      fi
      echo "===== settings.gradle ====="
      if [ -f settings.gradle ]; then
        sed -n '1,180p' settings.gradle
      fi
      echo "===== settings.gradle.kts ====="
      if [ -f settings.gradle.kts ]; then
        sed -n '1,180p' settings.gradle.kts
      fi
  - name: Build APK
    shell: bash
    run: |
      set -e
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew :app:assembleDebug --no-daemon --stacktrace --info
  - name: Collect APK
    shell: bash
    run: |
      set -e
      mkdir -p output
      APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -n 1)
      if [ -z "$APK" ]; then
        echo "ERROR: APK file was not generated."
        exit 1
      fi
      cp "$APK" output/SmsForwarder-V56.2.apk
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SmsForwarder-V56.2-APK
      path: output/SmsForwarder-V56.2.apk
      if-no-files-found: error
